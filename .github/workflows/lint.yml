name: Python Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy ruff tomlkit keyring pydantic
    - name: Lint with Ruff
      run: ruff check flatpaker
    - name: Lint with mypy
      run: mypy
