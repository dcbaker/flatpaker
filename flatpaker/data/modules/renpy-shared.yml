name: renpy-shared-components
buildsystem: "simple"
build-commands: []
modules:
  - name: "icoutils"
    buildsystem: "autotools"
    config-opts:
      - --mandir=/share/man
    cleanup:
      - "/share"
      - "/lib/*/*.a"
      - "/lib/*/*.la"
    cleanup-platform:
      - '*'
    sources:
      - type: "archive"
        url: "https://download.savannah.gnu.org/releases/icoutils/icoutils-0.32.3.tar.bz2"
        sha256: "17abe02d043a253b68b47e3af69c9fc755b895db68fdc8811786125df564c6e0"
      - type: "patch"
        path: ../patches/icoutils-fix-iterators.patch

  - name: icns
    config-opts:
      - --mandir=/share/man
    cleanup:
      - "/share"
      - "/lib/*/*.a"
      - "/lib/*/*.la"
    cleanup-platform:
      - '*'
    sources:
      - type: "archive"
        url: "https://downloads.sf.net/icns/libicns-0.8.1.tar.gz"
        sha256: "335f10782fc79855cf02beac4926c4bf9f800a742445afbbf7729dab384555c2"
      - type: "patch"
        path: "../patches/icns-add-missing-headers.patch"

  - name: unrar
    buildsystem: "simple"
    build-commands:
      # Use system cflags
      - sed -e '/CXXFLAGS=/d' -e '/LDFLAGS=/d' -i makefile

      - make -j$FLATPAK_BUILDER_N_JOBS
      - DESTDIR="${FLATPAK_DEST}" make install
    cleanup-platform:
      - '*'
    sources:
      - type: "archive"
        url: "https://www.rarlab.com/rar/unrarsrc-7.2.7.tar.gz"
        sha256: "01d903a7dcf413cb2925696d7796e48e38d471f79bfe7ef3ad2aebf6c12dbefd"

  - name: rpatool
    buildsystem: "simple"
    build-commands:
      - install -Dm755 rpatool -t ${FLATPAK_DEST}/bin
    cleanup-platform:
      - '*'
    sources:
      # Pointing to a fork with support for newer DMA archives
      - type: "git"
        url: "https://github.com/sebastic/rpatool.git"
        commit: "1ccda7a6dfa0617d3b4f2135a6def814b0ae17c4"

  - name: unrpa
    buildsystem: "simple"
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "unrpa" --no-build-isolation
    cleanup-platform:
      - '*'
    sources:
      - type: "file"
        url: https://files.pythonhosted.org/packages/59/c7/eac5f1c131f8e4e41268944bbfe60cb42dfcea2ec8fc5a0ee8476fd8b6bd/unrpa-2.3.0-py3-none-any.whl
        sha256: 17b024050e19edf470eb9abd91fa5fb2be63aa73c01f44d2ef9cf6978289eea9

  - name: un.rpyc
    buildsystem: "simple"
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} . --no-build-isolation
    cleanup-platform:
      - '*'
    sources:
      - type: "git"
        url: "https://github.com/CensoredUsername/unrpyc.git"
        tag: v2.0.2
