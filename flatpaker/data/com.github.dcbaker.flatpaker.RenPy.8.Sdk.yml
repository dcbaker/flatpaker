build-runtime: true
id: com.github.dcbaker.flatpaker.RenPy.Sdk
id-platform: com.github.dcbaker.flatpaker.RenPy.Platform
branch: "8"
runtime-version: "24.08"
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
inherit-extensions:
  - "org.freedesktop.Platform.GL"
modules:
  - "modules/renpy-shared.yml"
  - "modules/python3-requirements.json"
  - name: assimp
    buildsystem: cmake-ninja
    config-opts:
      - "-DASSIMP_BUILD_SAMPLES=OFF"
      - "-DASSIMP_WARNINGS_AS_ERRORS=OFF"
      - "-DASSIMP_BUILD_ASSIMP_TOOLS=OFF"
      - "-DASSIMP_BUILD_ZLIB=OFF"
    cleanup:
      - "/include"
      - "/lib/*/cmake"
      - "/lib/*/pkgconfig"
    sources:
      - type: "archive"
        url: "https://github.com/assimp/assimp/archive/refs/tags/v6.0.5.tar.gz"
        sha256: "edf3749559c2b7d1f758ffb66fc5bec62186221e623b7f2e8969f17ee46ecb6f"
  - name: glu
    buildsystem: meson
    sources:
      - type: archive
        url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
        sha256: bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f
    cleanup:
      - "/include"
      - "/lib/*/*.a"
      - "/lib/*/*.la"
      - "/lib/*/pkgconfig"
  - name: "ftgl"
    buildsystem: "autotools"
    config-opts:
      - "--with-pic"
      - "--disable-static"
    cleanup:
      - "/share"
      - "/lib/*.la"
    cleanup-platform:
      - "/include"
      - "/lib/cmake"
      - "/lib/pkgconfig"
      - "/lib/*.a"
    sources:
      - type: "git"
        url: "https://github.com/frankheckenbach/ftgl"
        commit: "483639219095ad080538e07ceb5996de901d4e74"
      - type: "patch"
        path: "patches/ftgl-disable-docs-demos.patch"
      - type: "patch"
        path: "patches/ftgl-fix-illegal-cast.patch"
  - name: PyGame_SDL2
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps . --exists-action=i --no-index --no-build-isolation
    sources:
      - type: archive
        url: "https://www.renpy.org/dl/8.4.1/pygame_sdl2-2.1.0+renpy8.4.1.tar.gz"
        sha256: "ac05762de19f2799784f23f474170b2dab0b63018b8b151291d6dc8afb8b93f8"
      - type: patch
        path: patches/pygame-sdl2-fix-header-install-path.patch
  - name: RenPy
    buildsystem: simple
    build-commands:
      - RENPY_DEPS_INSTALL="${FLATPAK_DEST}" CFLAGS="$CFLAGS $(pkg-config --cflags sdl2 ftgl)" pip3 install --prefix=${FLATPAK_DEST} --no-deps . --exists-action=i --no-index --no-build-isolation || exit 1

      # If this is initialized it tries to write files into a readonly location
      # and causes a crash It's also not useful since there is no steam in the
      # sandbox
      - rm renpy/common/00steam.rpy* || true

      - mv 00enabledebug.rpy renpy/common/

      # TODO: calculate where site packages is instead of hardocding
      - cp -rv renpy ${FLATPAK_DEST}/lib/python3.12/site-packages || exit 1
      - python -m compileall ${FLATPAK_DEST}/lib/python3.12/site-packages/renpy || exit 1
      - install -Dm755 renpy-bin -t ${FLATPAK_DEST}/bin/ || exit 1

      # the renpy script gets mad that /app/lib/game doesn't exist, use the
      # demo game as we need something complex enough to get the compile script
      # to compile everything
      # renpy-bin needs the extra fake arguments
      - |
        mkdir -p /app/lib/game/ || exit 1
        mv the_question /app/lib/game/game || exit 1
        pushd ${FLATPAK_DEST}/lib/python3.12/site-packages/renpy || exit 1
        ${FLATPAK_DEST}/bin/renpy-bin 'dummy' 'dummy' "/app/lib/game" compile || exit 1
        popd
        rm -r /app/lib/game || exit 1
    sources:
      - type: archive
        url: "https://www.renpy.org/dl/8.4.1/renpy-8.4.1-source.tar.bz2"
        sha256: "29e185b090a59a2415beeaf29e4067471dfc5d4ff296eb53b63d3954e171f2a1"
      # - type: patch
      #   path: patches/renpy-setuplib-fix-paths.patch
      # - type: patch
      #   path: patches/renpy-ffmpeg-7.patch
      - type: file
        path: files/renpy.py
        dest-filename: renpy-bin
      - type: file
        path: files/00enabledebug.rpy
    cleanup:
      - /app

