[build-system]
  requires = ["flit_core >=3.2,<4"]
  build-backend = "flit_core.buildapi"

[project]
  name = "flatpaker"
  authors = [{ name = "Dylan Baker", email = "dylan@pnwbakers.com" }]
  dynamic = ["version", "description"]
  readme = "README.md"
  requires-python = ">=3.10"
  keywords = ["flatpak", "renpy", "rpgmaker"]
  license = { text = "MIT" }
  classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Packaging",
  ]
  dependencies = [
    'pydantic',
    'tomlkit',
  ]

  [project.optional-dependencies]
    flat-manager = ["keyring"]
    lint = [
      'mypy',
      'ruff',
      'typing_extensions',
    ]

  [project.scripts]
    flatpaker = "flatpaker.entry:main"

  [project.urls]
    Repository = "https://github.com/dcbaker/flatpaker"
    Issues = "https://github.com/dcbaker/flatpaker/issues"

[tool.mypy]
  strict = true
  packages = "flatpaker"
  plugins = "pydantic.mypy"

[tool.ruff]
  line-length = 100

  [tool.ruff.format]
    quote-style = "preserve"

[tool.bumpversion]
  current_version = "0.1.1t"
  parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
  serialize = ["{major}.{minor}.{patch}"]
  search = "{current_version}"
  replace = "{new_version}"
  regex = false
  ignore_missing_version = false
  ignore_missing_files = false
  tag = true
  push_tag = false
  sign_tags = true
  tag_name = "v{new_version}"
  tag_message = "Bump version: {current_version} → {new_version}"
  allow_dirty = true
  commit = true
  message = "Bump version: {current_version} → {new_version}"
  moveable_tags = []
  commit_args = ""
  setup_hooks = []
  pre_commit_hooks = []
  post_commit_hooks = []
  allow_shell_hooks = false

  [[tool.bumpversion.files]]
    filename = "flatpaker/__init__.py"
